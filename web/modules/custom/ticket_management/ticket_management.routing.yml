# HTML UI routes.
ticket_management.overview:
  path: '/tickets'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketController::overview'
    _title: 'Tickets'
  requirements:
    _permission: 'access ticket overview'

ticket_management.ticket_add:
  path: '/tickets/add'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketController::add'
    _title: 'Create ticket'
  requirements:
    _permission: 'create ticket'
    _user_is_logged_in: 'TRUE'

ticket_management.ticket_view:
  path: '/tickets/{ticket}'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketController::view'
    _title: 'Ticket'
  requirements:
    _permission: 'view ticket'
    ticket: \d+

# ---------------------------------------------------------------------------
# Custom REST API (JSON)
# ---------------------------------------------------------------------------

ticket_management.api.tickets.collection:
  path: '/api/tickets'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketApiController::collection'
  methods: [GET]
  requirements:
    _permission: 'access ticket overview'

ticket_management.api.tickets.post:
  path: '/api/tickets'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketApiController::post'
  methods: [POST]
  requirements:
    _permission: 'create ticket'
    _user_is_logged_in: 'TRUE'

ticket_management.api.tickets.get:
  path: '/api/tickets/{id}'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketApiController::get'
  methods: [GET]
  requirements:
    _permission: 'view ticket'
    id: \d+

ticket_management.api.tickets.patch:
  path: '/api/tickets/{id}'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketApiController::patch'
  methods: [PATCH]
  requirements:
    _permission: 'edit ticket'
    _user_is_logged_in: 'TRUE'
    id: \d+

ticket_management.api.tickets.patch_status:
  path: '/api/tickets/{id}/status'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketApiController::patchStatus'
  methods: [PATCH]
  requirements:
    _permission: 'transition ticket status'
    _user_is_logged_in: 'TRUE'
    id: \d+

ticket_management.api.tickets.comments.post:
  path: '/api/tickets/{id}/comments'
  defaults:
    _controller: '\Drupal\ticket_management\Controller\TicketApiController::postComment'
  methods: [POST]
  requirements:
    _permission: 'create ticket comment'
    _user_is_logged_in: 'TRUE'
    id: \d+
